<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xolis Arenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <svg class="brand-icon" width="30" height="30" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M4 15L16 4L28 15V28H20V19H12V28H4V15Z" stroke="#ff385c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M12 28V19H20V28" stroke="#ff385c" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Xolis<span class="brand-accent">Arenda</span></span>
    </div>
    <select id="langSelect" class="lang-select">
      <option value="ru">RU</option>
      <option value="uz">UZ</option>
      <option value="en">EN</option>
    </select>
  </header>

  <div class="hero">
    <div class="hero-inner">
      <h1 class="hero-title" data-i18n="hero_title">Жильё в Ташкенте</h1>
      <p class="hero-subtitle" data-i18n="hero_subtitle">Аренда квартир, комнат и койко-мест</p>

      <div class="search-box">
        <div class="search-row">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
          </svg>
          <input type="text" id="searchText" data-i18n-ph="search_ph" placeholder="Район, адрес или ключевое слово">
          <button id="filterBtn" class="search-submit" aria-label="Найти">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="M20 20l-3.5-3.5"/>
            </svg>
          </button>
        </div>

        <div class="search-filters" id="filtersBlock">
          <input type="text" inputmode="numeric" id="minPrice" data-i18n-ph="min_price" placeholder="Мин. цена">
          <input type="text" inputmode="numeric" id="maxPrice" data-i18n-ph="max_price" placeholder="Макс. цена">
          <select id="rooms">
            <option value="" data-i18n="rooms">Комнаты</option>
            <option value="1" data-i18n="room_1">1 комната</option>
            <option value="2" data-i18n="room_2">2 комнаты</option>
            <option value="3" data-i18n="room_3">3 комнаты</option>
            <option value="4" data-i18n="room_4">4+ комнат</option>
          </select>
          <button id="resetBtn" class="reset-btn" data-i18n="reset">Сбросить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabAll" data-i18n="tab_all">🏠 Все объявления</button>
    <button class="tab-btn" id="tabMine" data-i18n="tab_mine">👤 Мои</button>
  </div>

  <button id="addBtn" class="add-btn" data-i18n="add_listing">➕ Добавить объявление</button>

  <div id="listings">Загрузка...</div>

  <div id="detailModal" class="detail-modal hidden">
    <div class="detail-header">
      <button class="detail-back" onclick="closeDetail()">←</button>
      <span class="detail-header-title" data-i18n="detail_title">Объявление</span>
    </div>
    <div id="detailContent"></div>
  </div>

  <div id="addModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="formTitle" data-i18n="new_listing">Новое объявление</h2>

      <label data-i18n="f_photos">Фотографии</label>
      <div class="photos-upload">
        <input type="file" id="f_photos" accept="image/*" multiple style="display:none">
        <button type="button" class="photo-add-btn" id="photoAddBtn" data-i18n="add_photo">📷 Добавить фото</button>
        <div id="photosPreview" class="photos-preview"></div>
      </div>

      <label data-i18n="f_title">Заголовок</label>
      <input type="text" id="f_title" data-i18n-ph="f_title_ph" placeholder="Например: Квартира в Юнусабаде">
      <small class="hint" id="h_title"></small>

      <label data-i18n="f_price">Цена (сум)</label>
      <input type="text" inputmode="numeric" id="f_price" placeholder="3 000 000">
      <small class="hint" id="h_price"></small>

      <label data-i18n="f_rooms">Комнат</label>
      <input type="number" id="f_rooms" placeholder="2">
      <small class="hint" id="h_rooms"></small>

      <label data-i18n="f_area">Площадь (м²)</label>
      <input type="number" id="f_area" placeholder="55">
      <small class="hint" id="h_area"></small>

      <label data-i18n="f_address">Адрес</label>
      <input type="text" id="f_address" data-i18n-ph="f_address_ph" placeholder="Юнусабад, 4 квартал">
      <small class="hint" id="h_address"></small>

      <label data-i18n="f_description">Описание</label>
      <textarea id="f_description" data-i18n-ph="f_description_ph" placeholder="Светлая квартира, есть всё для жизни"></textarea>
      <small class="hint" id="h_description"></small>

      <label data-i18n="f_telegram">Telegram арендодателя</label>
      <input type="text" id="f_telegram" data-i18n-ph="f_telegram_ph" placeholder="@username">
      <small class="hint" id="h_telegram"></small>

      <label class="checkbox-label">
        <input type="checkbox" id="f_student">
        <span data-i18n="f_student">Можно студентам</span>
      </label>

      <div class="modal-buttons">
        <button id="saveBtn" data-i18n="save">Сохранить</button>
        <button id="cancelBtn" class="cancel" data-i18n="cancel">Отмена</button>
      </div>

      <p id="formStatus"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
