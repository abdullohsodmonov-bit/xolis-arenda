<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xolis Arenda</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏠 Xolis Arenda</h1>
    <p class="subtitle">Поиск жилья в Ташкенте</p>
  </header>

  <div class="filters">
    <input type="number" id="minPrice" placeholder="Мин. цена">
    <input type="number" id="maxPrice" placeholder="Макс. цена">
    <select id="rooms">
      <option value="">Комнаты</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4+</option>
    </select>
    <button id="filterBtn">Найти</button>
  </div>

  <button id="addBtn" class="add-btn">➕ Добавить объявление</button>

  <div id="listings">Загрузка...</div>

  <div id="addModal" class="modal hidden">
    <div class="modal-content">
      <h2>Новое объявление</h2>

      <label>Заголовок</label>
      <input type="text" id="f_title" placeholder="Например: Квартира в Юнусабаде">

      <label>Цена (сум)</label>
      <input type="number" id="f_price" placeholder="3000000">

      <label>Комнат</label>
      <input type="number" id="f_rooms" placeholder="2">

      <label>Площадь (м²)</label>
      <input type="number" id="f_area" placeholder="55">

      <label>Адрес</label>
      <input type="text" id="f_address" placeholder="Юнусабад, 4 квартал">

      <label>Описание</label>
      <textarea id="f_description" placeholder="Светлая квартира, есть всё для жизни"></textarea>

      <label>Telegram арендодателя</label>
      <input type="text" id="f_telegram" placeholder="@username">

      <label class="checkbox-label">
        <input type="checkbox" id="f_student"> Можно студентам
      </label>

      <div class="modal-buttons">
        <button id="saveBtn">Сохранить</button>
        <button id="cancelBtn" class="cancel">Отмена</button>
      </div>

      <p id="formStatus"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
